services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: blockkick-api
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - ENV=${ENV:-development}
      - DEBUG=${DEBUG:-false}
      - BLOCKCHAIN_NODE_URL=${BLOCKCHAIN_NODE_URL:-http://host.docker.internal:3000}
      - BLOCKCHAIN_REQUEST_TIMEOUT=${BLOCKCHAIN_REQUEST_TIMEOUT:-30}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-blockkick}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-blockkick_dev}
      - DATABASE_POOL_SIZE=${DATABASE_POOL_SIZE:-10}
      - DATABASE_MAX_OVERFLOW=${DATABASE_MAX_OVERFLOW:-20}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - blockkick-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - ./app:/app/app:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./poetry.lock:/app/poetry.lock:ro

  db:
    image: postgres:15-alpine
    container_name: blockkick-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blockkick}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-blockkick_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - blockkick-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blockkick} -d ${POSTGRES_DB:-blockkick_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  pgadmin_data:

networks:
  blockkick-net:
    driver: bridge
