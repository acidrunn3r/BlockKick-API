name: CI

on:
  push:
    branches: [main, add-ci]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --with dev

      - name: ruff
        run: poetry run ruff check app/

      - name: black
        run: poetry run black --check app/

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: blockkick_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d blockkick_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run tests
        env:
          ENV: testing
          DEBUG: "True"
          HOST: "0.0.0.0"
          PORT: "8000"
          BLOCKCHAIN_NODE_URL: http://mock-blockchain:3000
          BLOCKCHAIN_REQUEST_TIMEOUT: "30"
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/blockkick_test
          DATABASE_POOL_SIZE: "5"
          DATABASE_MAX_OVERFLOW: "10"
          JWT_SECRET: test-secret-key-for-testing-only-1234567890abcdef
          JWT_ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: "60"
          REFRESH_TOKEN_EXPIRE_DAYS: "7"
        run: poetry run pytest

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            coverage.xml
            htmlcov/
